<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registration Form</title>

</head>

<body>

    <h1> Registration Form </h1>

    <form action="#" method="post" enctype="multipart/form-data">

     <fieldset>

    <legend> Personal Information </legend>

    <label for="fullName"> Full Name: </label>
    <input type="text" id="fullName" name="fullName" minlength="3" required>

   <br> <br>


    <label for="email"> Email Address: </label>
    <input type="email" id="email" name="email" required>

   <br> <br>


    <label for="password"> Password: </label>
    <input type="password" id="password" name="password" minlength="8" required>

   <br> <br>


    <label for="confirmPassword"> Confirm Password: </label>
    <input type="password" id="confirmPassword" name="confirmPassword" minlength="8" required>

   <br> <br>


    <label for="birthDate"> Date of Birth: </label>
    <input type="date" id="birthDate" name="birthDate" required>

</fieldset>

 <br> <br>

<fieldset>

    <legend> Contact Information </legend>

    <label for="phone"> Phone Number: </label>
    <input type="tel" id="phone" name="phone"
           pattern="[0-9]{10,15}"
           title="Enter 10 to 15 digits">
    <br><br>

    <label for="address"> Address: </label>
    <br>
    <textarea id="address" name="address" rows="3" cols="30"> </textarea>
    <br><br>

    <label for="city"> City: </label>
    <select id="city" name="city">

        <option value=""> Select a city </option>
        <option value="Gaza">Gaza</option>
        <option value="Rafah">Rafah</option>
        <option value="Khan Younis">Khan Younis</option>
        <option value="Nablus">Nablus</option>
        <option value="Ramallah">Ramallah</option>
        <option value="Hebron">Hebron</option>
    </select>

</fieldset>

    <br><br>


<fieldset>
    <legend>Preferences</legend>

    <p>Gender:</p>

    <input type="radio" id="male" name="gender" value="male">
    <label for="male">Male</label>

    <input type="radio" id="female" name="gender" value="female">
    <label for="female">Female</label>

    <p>Interests:</p>

    <input type="checkbox" id="programming"
           name="interests" value="programming">
    <label for="programming">Programming</label>
    <br>

    <input type="checkbox" id="design"
           name="interests" value="design">
    <label for="design">Design</label>
    <br>

    <input type="checkbox" id="gaming"
           name="interests" value="gaming">
    <label for="gaming">Gaming</label>
    <br>

    <input type="checkbox" id="reading"
           name="interests" value="reading">
    <label for="reading">Reading</label>
    <br>

    <input type="checkbox" id="sports"
           name="interests" value="sports">
    <label for="sports">Sports</label>

    <br><br>

    <label for="skillLevel">Skill Level (1-10):</label>
    <input type="range" id="skillLevel" name="skillLevel"
           min="1" max="10" value="5">

</fieldset>

    <br><br>

<fieldset>
    <legend>Profile Picture</legend>

    <label for="profilePicture">Upload Profile Picture:</label>
    <input type="file" id="profilePicture" name="profilePicture" accept="image/*">

</fieldset>

    <br><br>

    <input type="checkbox" id="terms" name="terms" required>
<label for="terms">I agree to the Terms and Conditions</label>

<br><br>

<button type="submit">Submit</button>
<button type="reset">Reset</button>



    </form> 
   

</body>
</html>
